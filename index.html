<meta property="og:description" content="AfriScope Media décrypte les dynamiques du continent africain.">
<meta property="og:type" content="website">

<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --teal:#007890;
  --teal-dark:#03566a;
  --teal-darker:#023f4d;
  --yellow:#ffed00;
  --yellow-dark:#d6ac00;
  --white:#ffffff;
  --ink:#122228;
  --ink-soft:#48606a;
  --bg:#ffffff;
  --bg-alt:#f4f8f9;
  --line:#e1e9eb;
  --premium:#a8760a;
  --radius:6px;
  --maxw:1180px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Ubuntu',sans-serif;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px;}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;}

/* ===== Top bar ===== */
.topbar{position:sticky;top:0;z-index:100;background:#007890;color:#fff;border-bottom:1px solid rgba(255,255,255,.18);}
.topbar-inner{display:flex;align-items:center;gap:18px;height:72px;max-width:var(--maxw);margin:0 auto;padding:0 20px;}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand img{height:44px;width:44px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-sizing:content-box;}
.brand-text{display:flex;flex-direction:column;line-height:1.05;}
.brand-text b{font-weight:700;font-size:18px;color:#fff;}
.brand-text span{font-weight:500;font-size:12px;letter-spacing:.02em;color:var(--yellow);}
.hamburger{display:none;background:none;border:0;padding:8px;margin-left:auto;}
.hamburger span{display:block;width:24px;height:2.5px;background:#fff;margin:5px 0;border-radius:2px;}
nav.mainnav{display:flex;gap:2px;flex:1;}
nav.mainnav a{padding:10px 14px;font-size:15px;font-weight:500;color:#fff;border-radius:4px;white-space:nowrap;}
nav.mainnav a:hover, nav.mainnav a.active{color:#fff;background:rgba(255,255,255,.14);}
.top-actions{display:flex;align-items:center;gap:10px;margin-left:auto;}
.search-box{display:flex;align-items:center;background:rgba(255,255,255,.14);border:1px solid var(--line);border-radius:20px;padding:6px 12px;gap:6px;width:200px;}
.search-box input{border:0;background:none;width:100%;font-size:14px;color:#fff;}
.search-box input::placeholder{color:rgba(255,255,255,.78);}
.search-box input:focus{outline:none;}
.news-ticker{width:100%;background:#023f4d;color:#fff;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.16);}
.news-ticker-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;min-height:34px;padding:0 20px;}
.news-ticker-label{flex:0 0 auto;background:var(--yellow);color:var(--teal-darker);font-size:12px;font-weight:700;padding:5px 9px;margin-right:10px;border-radius:3px;text-transform:uppercase;}
.news-ticker-window{overflow:hidden;white-space:nowrap;flex:1;}
.news-ticker-track{display:inline-flex;gap:34px;animation:tickerMove 35s linear infinite;}
.news-ticker-track a{font-size:13px;color:#fff;}
@keyframes tickerMove{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:20px;border:1.5px solid var(--teal);background:var(--teal);color:#fff;font-size:14px;font-weight:500;white-space:nowrap;}
.btn:hover{background:var(--teal-dark);}
.btn.outline{background:transparent;color:var(--teal);}
.btn.outline:hover{background:var(--teal);color:#fff;}
.btn.ghost{border-color:transparent;background:var(--bg-alt);color:var(--ink);}
.btn.small{padding:6px 12px;font-size:13px;border-radius:16px;}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:var(--teal-darker);font-weight:700;}
.btn.yellow:hover{background:var(--yellow-dark);}
.btn.danger{background:#b93a3a;border-color:#b93a3a;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

/* ===== Side drawer (mobile) ===== */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199;display:none;}
.drawer-overlay.open{display:block;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--teal);
  transform:translateX(-100%);transition:transform .25s ease;z-index:200;
  display:flex;flex-direction:column;padding:22px 20px;color:#fff;overflow-y:auto;}
.drawer.open{transform:translateX(0);}
.drawer-close{align-self:flex-end;background:none;border:0;color:#fff;font-size:22px;padding:4px 8px;}
.drawer .brand-text b{color:#fff;}
.drawer .brand-text span{color:var(--yellow);}
.drawer .brand img{border:3px solid var(--white);box-sizing:content-box;}
.drawer-search{display:flex;align-items:center;background:rgba(255,255,255,.15);border-radius:20px;padding:8px 14px;margin:18px 0;gap:8px;}
.drawer-search input{background:none;border:0;color:#fff;width:100%;font-size:14px;}
.drawer-search input::placeholder{color:rgba(255,255,255,.7);}
.drawer-search input:focus{outline:none;}
.drawer nav{display:flex;flex-direction:column;margin-top:6px;}
.drawer nav a{padding:12px 6px;font-size:16px;font-weight:500;border-bottom:1px solid rgba(255,255,255,.15);}
.drawer-social{display:flex;gap:14px;margin-top:auto;padding-top:20px;}
.drawer-social a{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;}

/* ===== Hero ===== */
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 16px;}
.section-title h2{font-size:22px;font-weight:700;color:var(--teal-darker);margin:0;border-left:5px solid var(--yellow);padding-left:10px;}
.section-title a{font-size:13px;color:var(--teal);font-weight:500;}
.hero{margin:24px 0;display:grid;grid-template-columns:1.6fr 1fr;gap:16px;}
.hero-main{position:relative;border-radius:var(--radius);overflow:hidden;min-height:420px;display:flex;align-items:flex-end;background:#0e2c33;}
.hero-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.8;}
.hero-main .overlay{position:relative;z-index:2;padding:28px;background:linear-gradient(0deg,rgba(2,20,25,.92),rgba(2,20,25,.1) 70%);width:100%;}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--yellow);color:var(--teal-darker);font-weight:700;font-size:12px;padding:4px 10px;border-radius:14px;text-transform:none;}
.pill.on-dark{background:var(--yellow);}
.hero-main h1{color:#fff;font-size:30px;line-height:1.2;margin:10px 0 8px;font-weight:700;}
.hero-main p{color:#d9e6e9;font-size:15px;max-width:620px;margin:0 0 6px;}
.meta-line{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--ink-soft);}
.meta-line.on-dark{color:#b9ccd0;}
.hero-side{display:flex;flex-direction:column;gap:14px;}
.side-card{display:flex;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;}
.side-card img{width:96px;height:72px;object-fit:cover;border-radius:4px;flex-shrink:0;}
.side-card h3{font-size:15px;line-height:1.3;margin:0 0 6px;font-weight:700;}
.side-card .meta-line{font-size:12px;}

/* ===== Grids / cards ===== */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;background:#fff;}
.card img{height:170px;object-fit:cover;}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;}
.card-body h3{font-size:16px;line-height:1.35;margin:0;font-weight:700;}
.card-body p{font-size:13.5px;color:var(--ink-soft);margin:0;flex:1;}
.crown{color:var(--premium);font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:3px;}
section.rubrique-block{margin:40px 0;}

/* ===== Article page ===== */
.progress-bar{position:relative;top:auto;left:auto;height:4px;background:#d90429;z-index:90;width:0%;transition:width .1s linear;}
.article-head{max-width:760px;margin:28px auto 0;padding:0 20px;}
.article-head .pill{margin-bottom:12px;}
.article-head h1{font-size:32px;line-height:1.25;margin:0 0 14px;font-weight:700;color:var(--ink);}
.article-head .excerpt{font-size:17px;color:var(--ink-soft);margin:0 0 16px;}
.author-row{display:flex;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.author-row .who b{display:block;font-size:14px;}
.author-row .who span{font-size:12.5px;color:var(--ink-soft);}
.share-row{display:flex;gap:8px;margin-left:auto;}
.share-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-alt);border:1px solid var(--line);font-size:14px;}
.article-cover{max-width:900px;margin:22px auto;padding:0 20px;}
.article-cover img{width:100%;border-radius:var(--radius);}
.article-body{max-width:760px;margin:0 auto;padding:0 20px 40px;font-size:17px;line-height:1.85;color:#233238;}
.article-body p{margin:0 0 20px;}
.paywall-wrap{position:relative;}
.paywall-fade{position:absolute;bottom:0;left:0;right:0;height:220px;background:linear-gradient(0deg,#fff 30%,rgba(255,255,255,0));pointer-events:none;}
.blurred{filter:blur(5px);user-select:none;}
.newsletter-box{max-width:760px;margin:0 auto 40px;padding:26px;background:var(--bg-alt);border:1.5px solid var(--teal);border-radius:10px;}
.newsletter-box h3{margin:0 0 6px;color:var(--teal-darker);font-size:19px;}
.newsletter-box p{margin:0 0 16px;color:var(--ink-soft);font-size:14px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.form-row input{padding:11px 13px;border:1px solid var(--line);border-radius:6px;font-size:14px;width:100%;}
.tag-row{display:flex;gap:8px;margin:22px auto 30px;max-width:760px;padding:0 20px;flex-wrap:wrap;}
.tag-chip{background:var(--bg-alt);border:1px solid var(--line);padding:5px 12px;border-radius:14px;font-size:12.5px;color:var(--teal-darker);}

/* ===== Ads ===== */
.ad-slot{max-width:900px;margin:26px auto;padding:0 20px;}
.ad-inner{border:1px dashed var(--line);border-radius:8px;padding:16px;text-align:center;background:var(--bg-alt);color:var(--ink-soft);font-size:12.5px;}
.ad-inner img{margin:0 auto 6px;max-height:120px;}
.sidebar-ad{position:sticky;top:90px;}

/* ===== Contact ===== */
.contact-wrap{max-width:900px;margin:34px auto;padding:0 20px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px;}
.contact-form label{display:block;font-size:13px;font-weight:500;margin:0 0 5px;color:var(--ink-soft);}
.contact-form .field{margin-bottom:14px;}
.contact-form input,.contact-form textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:6px;font-size:14px;}
.contact-form textarea{min-height:130px;resize:vertical;}
.contact-card{background:var(--teal);color:#fff;border-radius:10px;padding:26px;height:fit-content;}
.contact-card h3{margin:0 0 12px;font-size:18px;}
.contact-card .cline{display:flex;gap:10px;margin-bottom:14px;font-size:14px;align-items:flex-start;}
.contact-card a.cta{display:inline-block;margin-top:8px;background:var(--yellow);color:var(--teal-darker);padding:9px 16px;border-radius:20px;font-weight:700;font-size:13.5px;}

/* ===== Footer ===== */
footer{background:var(--teal);color:#fff;margin-top:50px;width:100%;}
.footer-inner{width:100%;max-width:var(--maxw);margin:0 auto;padding:40px 20px 20px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px;}
.footer-inner h4{font-size:14px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 14px;color:var(--yellow);}
.footer-inner a{display:block;font-size:14px;margin-bottom:9px;color:#e4f0f2;}
.footer-brand{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
.footer-brand img{height:40px;width:40px;border-radius:50%;object-fit:cover;border:3px solid var(--white);box-sizing:content-box;}
.footer-slogan{font-size:13.5px;color:#cfe6ea;max-width:280px;line-height:1.6;}
.footer-social{display:flex;gap:10px;margin-top:14px;}
.footer-social a{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;margin:0;}
.footer-bottom{border-top:1px solid rgba(255,255,255,.2);text-align:center;padding:16px 20px;font-size:12.5px;color:#cfe6ea;}

/* ===== Admin ===== */
.admin-shell{display:flex;min-height:100vh;background:var(--bg-alt);}
.admin-side{width:230px;background:var(--teal-darker);color:#fff;flex-shrink:0;display:flex;flex-direction:column;padding:20px 0;}
.admin-side .abrand{display:flex;align-items:center;gap:10px;padding:0 18px 18px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:12px;}
.admin-side .abrand img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--white);box-sizing:content-box;}
.admin-side .abrand b{font-size:14px;}
.admin-nav a{display:flex;align-items:center;gap:10px;padding:11px 18px;font-size:14px;color:#d7e8ea;border-left:3px solid transparent;}
.admin-nav a:hover{background:rgba(255,255,255,.06);}
.admin-nav a.active{background:rgba(255,255,255,.12);border-left-color:var(--yellow);color:#fff;font-weight:500;}
.admin-nav .sep{height:1px;background:rgba(255,255,255,.15);margin:10px 18px;}
.admin-main{flex:1;padding:26px 30px;overflow-x:auto;min-width:0;}
.image-upload-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}
.image-preview{max-width:260px;max-height:150px;border-radius:6px;border:1px solid var(--line);object-fit:cover;margin-top:8px;}
.article-filter-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 18px;}
.article-filter-tabs a{padding:7px 11px;border:1px solid var(--line);border-radius:18px;font-size:13px;}
.article-filter-tabs a.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.analytics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:800px){
.topbar-inner{height:64px;padding:0 14px}.topbar{position:sticky}.top-actions{display:none}.mainnav{display:none!important}.hamburger{display:block}
.news-ticker-inner{padding:0 12px}.news-ticker-track{animation-duration:28s}.image-upload-row,.analytics-grid{grid-template-columns:1fr}
.footer-inner{grid-template-columns:1fr!important;padding-left:16px;padding-right:16px}
.admin-shell{display:flex;flex-direction:column;min-height:100vh}.admin-side{position:sticky;top:0;left:auto;width:100%;min-width:0;min-height:auto;height:auto;padding:10px 0;z-index:150;overflow:hidden}
.admin-side .abrand{padding:0 14px 10px}.admin-nav{display:flex;overflow-x:auto;overflow-y:hidden;gap:2px;padding:0 8px;scrollbar-width:thin}
.admin-nav a{white-space:nowrap;flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;padding:9px 11px}.admin-nav .sep{display:none}
.admin-main{width:100%;max-width:100%;padding:18px 14px;overflow-x:hidden}.stat-grid{grid-template-columns:1fr 1fr!important}.formgrid{grid-template-columns:1fr!important}
.article-head h1{font-size:26px}.author-row{align-items:flex-start;flex-wrap:wrap}.share-row{margin-left:0;flex-basis:100%}.share-btn{width:32px;height:32px}.footer-bottom{width:100%}
}

.admin-topline{display:flex;align-items:center;margin-bottom:22px;}
.admin-topline h1{font-size:22px;margin:0;color:var(--ink);}
.admin-topline .btn{margin-left:auto;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;}
.stat-card b{display:block;font-size:26px;color:var(--teal-darker);}
.stat-card span{font-size:13px;color:var(--ink-soft);}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:20px;}
.panel h3{margin:0 0 14px;font-size:16px;color:var(--teal-darker);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
table th{text-align:left;padding:9px 10px;color:var(--ink-soft);border-bottom:2px solid var(--line);font-weight:500;}
table td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
.status-badge{padding:3px 9px;border-radius:12px;font-size:11.5px;font-weight:600;}
.status-badge.published{background:#dcf3e0;color:#1c7a34;}
.status-badge.draft{background:#eee;color:#666;}
.status-badge.scheduled{background:#fdf0cf;color:#8a6300;}
.status-badge.trash{background:#fbdede;color:#a5312f;}
.icon-btn{background:none;border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:12px;margin-right:4px;}
.icon-btn:hover{background:var(--bg-alt);}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.f-field{margin-bottom:14px;}
.f-field label{display:block;font-size:13px;font-weight:500;margin-bottom:5px;color:var(--ink-soft);}
.f-field input,.f-field select,.f-field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font-size:14px;}
.f-field textarea{min-height:220px;resize:vertical;font-family:inherit;}
.tagpick{display:flex;flex-wrap:wrap;gap:8px;}
.tagpick label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);padding:5px 10px;border-radius:14px;font-size:12.5px;font-weight:400;cursor:pointer;}
.tagpick input{width:auto;}
.login-box{max-width:360px;margin:100px auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:30px;}
.login-box img{height:56px;margin:0 auto 16px;}
.login-box h2{text-align:center;margin:0 0 4px;font-size:19px;}
.login-box p.sub{text-align:center;color:var(--ink-soft);font-size:13px;margin:0 0 20px;}
.hint{font-size:12px;color:var(--ink-soft);margin-top:14px;}
.ai-panel{background:#f0f9fb;border:1.5px dashed var(--teal);border-radius:8px;padding:16px;margin-bottom:18px;}
.ai-panel h4{margin:0 0 10px;color:var(--teal-darker);font-size:14px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;}
.bar-row .lbl{width:110px;flex-shrink:0;color:var(--ink-soft);}
.bar-track{flex:1;background:var(--bg-alt);border-radius:4px;height:10px;overflow:hidden;}
.bar-fill{background:var(--teal);height:100%;}
.bar-row .val{width:40px;text-align:right;color:var(--ink-soft);}
.empty{color:var(--ink-soft);font-size:14px;padding:20px 0;text-align:center;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:24px;font-size:14px;z-index:500;opacity:0;pointer-events:none;transition:opacity .25s;}
.toast.show{opacity:1;}
.popup-ad{position:fixed;bottom:20px;right:20px;max-width:280px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:14px;z-index:150;}
.popup-ad button.close{position:absolute;top:6px;right:8px;background:none;border:0;font-size:16px;color:var(--ink-soft);}

/* ===== responsive ===== */
@media (max-width:920px){
  .hero{grid-template-columns:1fr;}
  .grid3{grid-template-columns:1fr 1fr;}
  .contact-wrap{grid-template-columns:1fr;}

/* ---------- utilitaires ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nowIso(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}) + ' · ' +
         d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function readTime(text){ const words=(text||'').trim().split(/\s+/).length; return Math.max(1,Math.round(words/200)); }
function initials(name){ return (name||'A').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window._toastT); window._toastT=setTimeout(()=>t.classList.remove('show'),2200);
}
function slugify(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

/* ---------- persistance Supabase uniquement ---------- */
function publicDBPayload(){
  return {
    categories: DB.categories || [], authors: DB.authors || [], tags: DB.tags || [],
    articles: DB.articles || [], ads: DB.ads || []
  };
}
async function loadPrivateData(){
  DB.subscribers=[]; DB.contactMessages=[]; DB.analytics=[];
  if(!supa || !adminLogged) return;
  try{
    const [sub,msg,ana]=await Promise.all([
      supa.from('newsletter_subscribers').select('*').order('created_at',{ascending:false}),
      supa.from('contact_messages').select('*').order('created_at',{ascending:false}),
      supa.from('analytics_events').select('*').order('created_at',{ascending:false}).limit(5000)
    ]);
    if(!sub.error) DB.subscribers=(sub.data||[]).map(x=>({id:x.id,first:x.first_name||'',last:x.last_name||'',email:x.email,phone:x.phone||'',createdAt:x.created_at}));
    if(!msg.error) DB.contactMessages=(msg.data||[]).map(x=>({id:x.id,name:x.name,subject:x.subject,message:x.message,email:x.email,phone:x.phone||'',createdAt:x.created_at,read:x.read||false}));
    if(!ana.error) DB.analytics=(ana.data||[]).map(x=>({ts:x.created_at,path:x.path,device:x.device,ref:x.referrer||'direct',country:x.country||'Inconnu',region:x.region||'',city:x.city||'',visitorId:x.visitor_id,sessionId:x.session_id}));
  }catch(e){ console.warn('Données privées indisponibles:',e); }
}
async function loadDB(){
  if(!supa) throw new Error('Supabase n’est pas configuré. Vérifiez config.js.');
  const {data,error}=await supa.from('site_data').select('data').eq('id','main').maybeSingle();
  if(error) throw error;
  if(!data?.data) throw new Error('La ligne site_data/main est absente. Exécutez setup.sql puis initialisez le contenu.');
  DB=data.data;
  DB.categories=DB.categories||[]; DB.authors=DB.authors||[]; DB.tags=DB.tags||[]; DB.articles=DB.articles||[]; DB.ads=DB.ads||[];
  DB.subscribers=[]; DB.contactMessages=[]; DB.analytics=[];
  await loadPrivateData();
}
async function saveDB(){
  if(!supa || !adminLogged) throw new Error('Session administrateur Supabase requise.');
  const {error}=await supa.from('site_data').upsert({id:'main',data:publicDBPayload(),updated_at:new Date().toISOString()});
  if(error) throw error;
  return true;
}
async function insertNewsletterSubscriber(row){
  if(!supa) throw new Error('Supabase non configuré.');
  const {error}=await supa.from('newsletter_subscribers').insert({first_name:row.first,last_name:row.last,email:row.email,phone:row.phone||null});
  if(error && !String(error.message||'').toLowerCase().includes('duplicate')) throw error;
}
async function insertContactMessage(row){
  if(!supa) throw new Error('Supabase non configuré.');
  const {error}=await supa.from('contact_messages').insert({name:row.name,subject:row.subject,message:row.message,email:row.email,phone:row.phone||null});
  if(error) throw error;
}

/* ---------- analytics ---------- */
function detectDevice(){ const ua=navigator.userAgent; if(/tablet|ipad/i.test(ua)) return 'tablette'; if(/mobi|android|iphone/i.test(ua)) return 'smartphone'; return 'ordinateur'; }
function getVisitorId(){ let id=localStorage.getItem('afriscope_visitor_id'); if(!id){id=crypto.randomUUID?crypto.randomUUID():uid();localStorage.setItem('afriscope_visitor_id',id);} return id; }
function getSessionId(){ let id=sessionStorage.getItem('afriscope_session_id'); if(!id){id=crypto.randomUUID?crypto.randomUUID():uid();sessionStorage.setItem('afriscope_session_id',id);} return id; }
async function logVisit(path){
  const payload={path,device:detectDevice(),referrer:document.referrer||'direct',visitorId:getVisitorId(),sessionId:getSessionId(),title:document.title||'AfriScope Media'};
  if(supa){ try{ await fetch(ANALYTICS_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true}); }catch(e){ console.debug('Analytics non disponible',e); } }
  else { DB.analytics.push({...payload,ts:nowIso(),ref:payload.referrer}); if(DB.analytics.length>5000) DB.analytics=DB.analytics.slice(-5000); }
}

async function getVisitorFlag(){
  const v = await storageGet('subscribed');
  return v === 'true';
}
async function setVisitorFlag(){
  await storageSet('subscribed','true');
}

window.addEventListener('DOMContentLoaded', async ()=>{
  const fav = document.getElementById('faviconLink');
  if(fav) fav.href = LOGO;
  if(supa){
    try{
      // Supabase v2 récupère automatiquement la session après un lien e-mail/OAuth.

      if(error) console.warn('Supabase session:', error);

        adminLogged = !!session;

function route(){
  const h = location.hash.replace(/^#\/?/,'') || '';
  if(h) return h.split('/').filter(Boolean);
  const pathname = decodeURIComponent(location.pathname || '/');
  const base = SITE_BASE_PATH || '';
  let relative = pathname;
  if(base && (pathname===base || pathname.startsWith(base+'/'))) relative = pathname.slice(base.length);
  relative = relative.replace(/^\/+|\/+$/g,'');
  return relative ? relative.split('/').filter(Boolean) : [];
}

async function render(){
  const parts=route();
  document.getElementById('app').innerHTML='';
  window.scrollTo(0,0);
  try{
    if(!DB) await loadDB();
    if(parts[0]==='admin'){ renderAdmin(parts.slice(1)); return; }
    await logVisit('/'+parts.join('/'));
    renderPublic(parts);
  }catch(e){
    console.error(e);
    document.getElementById('app').innerHTML='<div class="wrap" style="padding-top:60px;padding-bottom:60px"><div class="panel"><h2 style="color:var(--teal-darker)">Configuration du site requise</h2><p style="color:var(--ink-soft)">'+escapeHtml(e.message||'Impossible de charger les données.')+'</p></div></div>';
  }
}

function tagName(id){ const t=DB.tags.find(t=>t.id===id); return t? t.name : id; }
function activeAds(type){ return DB.ads.filter(a=>a.active && a.type===type); }

function adBlock(type, extraClass){
  const ads = activeAds(type);

  return ads.map(ad=>`

        <img src="${ad.imageUrl}" alt="Publicité — ${escapeHtml(ad.name)}">

    </div>`).join('');
}

function setMetaTag(property, content){
  let m=document.querySelector(`meta[property="${property}"]`);
  if(!m){m=document.createElement('meta');m.setAttribute('property',property);document.head.appendChild(m);}
  m.setAttribute('content',content||'');
}
function setPageMeta({title,description,url,type='website',image=''}={}){
  const t=title||'AfriScope Media — Actualités, analyses et enquêtes sur l’Afrique';
  const d=(description||'AfriScope Media décrypte les dynamiques du continent africain avec des analyses, enquêtes et focus sur l’actualité africaine.').replace(/\s+/g,' ').trim().slice(0,160);
  document.title=t;
  const md=document.querySelector('meta[name="description"]'); if(md) md.setAttribute('content',d);
  setMetaTag('og:title',t); setMetaTag('og:description',d); setMetaTag('og:type',type); setMetaTag('og:url',url||PUBLIC_SITE_URL);
  setMetaTag('og:image',image||''); setMetaTag('twitter:title',t); setMetaTag('twitter:description',d); setMetaTag('twitter:image',image||'');
  const canon=document.getElementById('canonicalLink') || document.querySelector('link[rel="canonical"]'); if(canon) canon.href=url||PUBLIC_SITE_URL;
}
function setArticleMeta(a){
  const desc=(a.excerpt||a.content||'').replace(/\s+/g,' ').trim().slice(0,160);
  const publicArticleUrl=siteUrl('article/'+encodeURIComponent(a.slug));
  document.title=a.title+' | AfriScope Media';
  let metaDesc=document.querySelector('meta[name="description"]'); if(metaDesc) metaDesc.setAttribute('content',desc);
  setMetaTag('og:title',a.title+' | AfriScope Media');
  setMetaTag('og:description',desc); setMetaTag('og:type','article'); setMetaTag('og:image',a.image||''); setMetaTag('og:image:alt',a.title);
  setMetaTag('og:url',publicArticleUrl); setMetaTag('og:site_name','AfriScope Media');
  setMetaTag('twitter:card','summary_large_image'); setMetaTag('twitter:title',a.title+' | AfriScope Media');
  setMetaTag('twitter:description',desc); setMetaTag('twitter:image',a.image||'');
  let canon=document.getElementById('canonicalLink') || document.querySelector('link[rel="canonical"]'); if(!canon){canon=document.createElement('link');canon.rel='canonical';document.head.appendChild(canon);} canon.href=publicArticleUrl;
  return publicArticleUrl;
}

async function renderArticlePage(slug){
  const a = publicArticles().find(x=>x.slug===slug);
  if(!a){ document.getElementById('app').innerHTML = chrome('<div class="wrap"><p class="empty">Article introuvable.</p></div>',''); return; }
  const publicArticleUrl=setArticleMeta(a);
  let metaDesc = document.querySelector('meta[name="description"]');
  if(metaDesc) metaDesc.setAttribute('content', a.excerpt);
  injectArticleJsonLd(a);

  const subscribed = a.premium ? (sessionSubscribed || await getVisitorFlag()) : true;
  const paragraphs = a.content.split(/\n\n+/);
  let contentHtml;
  if(a.premium && !subscribed){
    const cut = Math.max(1, Math.ceil(paragraphs.length*0.15));
    const free = paragraphs.slice(0,cut).map(p=>`<p>${escapeHtml(p)}</p>`).join('');
    // Teaser très court (1 paragraphe flouté maximum) : le formulaire doit apparaître
    // juste là où le texte devient flou, pas après tout le contenu verrouillé.
    const teaser = paragraphs.slice(cut, cut+1).map(p=>`<p>${escapeHtml(p)}</p>`).join('');
    contentHtml = `<div>${free}</div>
      <div class="paywall-wrap" style="max-height:120px;overflow:hidden;margin-bottom:0;">
        <div class="blurred">${teaser}</div>
        <div class="paywall-fade"></div>
      </div>
      <div class="newsletter-box">
        <h3>Contenu réservé aux abonnés</h3>
        <p>Inscrivez-vous gratuitement à la newsletter AfriScope Media pour débloquer cet article et tous nos contenus premium.</p>
        <form onsubmit="return submitNewsletter(event,'${a.id}')">
          <div class="form-row">
            <input required placeholder="Prénom" id="nl_first">
            <input required placeholder="Nom" id="nl_last">
          </div>
          <div class="form-row">
            <input required type="email" placeholder="Adresse email" id="nl_email">
            <input type="tel" placeholder="Numéro WhatsApp (optionnel)" id="nl_phone">
          </div>
          <button class="btn yellow" type="submit" style="width:100%;justify-content:center">Je m'abonne et je lis l'article</button>
        </form>
      </div>`;
  } else {
    contentHtml = `<div>${paragraphs.map(p=>`<p>${escapeHtml(p)}</p>`).join('')}</div>`;
  }

  const shareTarget = OG_FUNCTION_URL + '?slug=' + encodeURIComponent(a.slug);

  `;
  document.getElementById('app').innerHTML = chrome(body,'article/'+slug);
  setupProgressBar();
}

function setupProgressBar(){
  if(window._progressHandler) document.removeEventListener('scroll',window._progressHandler);
  const bar = document.getElementById('progressBar');
  function onScroll(){
    const h = document.documentElement;
    const scrolled = (h.scrollTop)/((h.scrollHeight)-h.clientHeight)*100;
    bar.style.width = Math.min(100,Math.max(0,scrolled))+'%';
  }
  window._progressHandler=onScroll; document.addEventListener('scroll', onScroll,{passive:true});
  onScroll();
}

function injectArticleJsonLd(a){

  });

}

function extractJsonObject(text){
  // Retire d'éventuelles balises markdown puis isole le premier objet JSON valide du texte,
  // même si le modèle a ajouté une phrase d'introduction ou de conclusion.
  let clean = (text||'').replace(/```json/gi,'```').replace(/```/g,'').trim();
  const start = clean.indexOf('{');
  const end = clean.lastIndexOf('}');
  if(start===-1 || end===-1 || end<=start) throw new Error("Aucun objet JSON trouvé dans la réponse.");
  clean = clean.slice(start, end+1);
  return JSON.parse(clean);
}

async function generateArticleAI(){
  const topic=document.getElementById('ai_topic').value.trim(); if(!topic){toast('Merci de préciser un sujet');return;}
  const angle=document.getElementById('ai_angle').value.trim(), catId=document.getElementById('ai_cat').value, len=document.getElementById('ai_len').value;
  const source=document.getElementById('ai_source').value.trim(), mode=document.getElementById('ai_mode').value;
  const btn=document.getElementById('aiBtn'), status=document.getElementById('aiStatus'); btn.disabled=true; status.textContent='⏳ Génération côté serveur…';
  try{
    const {data,error}=await supa.functions.invoke('ai-editor',{body:{topic,angle,category:catName(catId),categoryId:catId,length:len,source,mode}});
    if(error) throw error; const parsed=data?.article||data;
    if(!parsed?.title||!parsed?.content) throw new Error('Réponse IA incomplète.');
    document.getElementById('f_title').value=parsed.title;
    document.getElementById('f_excerpt').value=parsed.excerpt||'';
    document.getElementById('f_content').value=parsed.content||'';
    document.getElementById('f_cat').value=catId;
    if(parsed.seo_title) document.getElementById('f_seo_title').value=parsed.seo_title;
    if(parsed.seo_description) document.getElementById('f_seo_description').value=parsed.seo_description;
    if(Array.isArray(parsed.tags)){
      document.querySelectorAll('.tagpick input').forEach(cb=>{const tag=DB.tags.find(t=>t.id===cb.value);cb.checked=!!tag&&parsed.tags.some(x=>slugify(x)===tag.id);});
    }
    status.textContent='✓ Article, chapô, tags et métadonnées générés. Relisez avant publication.'; toast('Contenu IA généré.');
  }catch(e){ console.error(e); status.textContent='❌ '+(e.message||'Échec de génération'); toast('Génération IA indisponible.'); }
  btn.disabled=false;
}

async function uploadArticleImage(ev){
  const file=ev.target.files?.[0]; if(!file) return;
  const status=document.getElementById('imageUploadStatus'); status.textContent='⏳ Téléversement…';
  try{
    if(!supa||!adminLogged) throw new Error('Session administrateur requise.');
    if(file.size>8*1024*1024) throw new Error('Image trop volumineuse (8 Mo maximum).');
    if(!/^image\//.test(file.type)) throw new Error('Le fichier doit être une image.');
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase(), path='articles/'+Date.now()+'-'+uid()+'.'+ext;
    const {error}=await supa.storage.from('article-images').upload(path,file,{upsert:false,contentType:file.type,cacheControl:'31536000'});
    if(error) throw error;
    const {data}=supa.storage.from('article-images').getPublicUrl(path); document.getElementById('f_image').value=data.publicUrl; previewArticleImage(data.publicUrl); status.textContent='✓ Image téléversée.';
  }catch(e){status.textContent='❌ '+(e.message||'Échec');}
}
function previewArticleImage(url){ const img=document.getElementById('imagePreview'); if(img&&url) img.src=url; }

async function saveArticle(ev, id){
  ev.preventDefault();
  const title = document.getElementById('f_title').value.trim();
  const excerpt = document.getElementById('f_excerpt').value.trim();
  const category = document.getElementById('f_cat').value;
  const author = document.getElementById('f_author').value;
  const image = document.getElementById('f_image').value.trim() || 'https://placehold.co/1200x700';
  const seoTitle=document.getElementById('f_seo_title')?.value.trim() || (title+' | AfriScope Media');
  const seoDescription=document.getElementById('f_seo_description')?.value.trim() || excerpt;
  const premium = document.getElementById('f_premium').checked;
  const content = document.getElementById('f_content').value.trim();
  const status = document.getElementById('f_status').value;
  const scheduleAt = document.getElementById('f_scheduleAt').value;
  const tags = Array.from(document.querySelectorAll('.tagpick input:checked')).map(i=>i.value).slice(0,2);
  let publishAt = null;
  if(status==='published') publishAt = nowIso();
  else if(status==='scheduled') publishAt = scheduleAt ? new Date(scheduleAt).toISOString() : nowIso();

  if(id){
    const a = DB.articles.find(x=>x.id===id);
    Object.assign(a,{title,excerpt,category,author,image,seoTitle,seoDescription,premium,content,status,publishAt,tags,readMinutes:readTime(content),slug:a.slug||slugify(title)});
  } else {
    DB.articles.push({id:uid(),title,slug:slugify(title)+'-'+uid().slice(0,4),excerpt,content,image,seoTitle,seoDescription,category,author,tags,premium,status,publishAt,createdAt:nowIso(),deletedAt:null,readMinutes:readTime(content)});
  }
  await saveDB();
  toast('Article enregistré');
  location.hash = '#/admin/articles';
  return false;
}

async function addSimple(ev,key){
  ev.preventDefault();
  const input = document.getElementById('new_'+key);
  const name = input.value.trim(); if(!name) return false;
  if(key==='categories'){
    const color = document.getElementById('new_categories_color')?.value || '#007890';
    DB.categories.push({id: slugify(name)+'-'+uid().slice(0,4), name, color});
  } else {
    DB[key].push({id: key==='tags'?slugify(name):uid(), name});
  }
  await saveDB(); toast('Ajouté'); render();
  return false;
}
async function deleteSimple(key,id){
  const inUse = DB.articles.some(a=> key==='categories'? a.category===id : key==='authors'? a.author===id : a.tags.includes(id));
  if(inUse && !confirm("Cet élément est utilisé par au moins un article. Supprimer quand même ?")) return;
  DB[key] = DB[key].filter(x=>x.id!==id);
  await saveDB(); toast('Supprimé'); render();
}

async function saveAd(ev){
  ev.preventDefault();
  const name=document.getElementById('ad_name').value.trim();
  const type=document.getElementById('ad_type').value;
  const imageUrl=document.getElementById('ad_image').value.trim();
  const linkUrl=document.getElementById('ad_link').value.trim();
  if(!name||!imageUrl||!linkUrl){ toast("Merci de renseigner le nom, l'image et le lien"); return false; }
  if(editingAdId){
    const ad = DB.ads.find(a=>a.id===editingAdId);
    Object.assign(ad,{name,type,imageUrl,linkUrl});
    editingAdId = null;
    toast('Encart mis à jour');
  } else {
    DB.ads.push({id:uid(),name,type,imageUrl,linkUrl,active:false});
    toast('Encart ajouté — pensez à le publier pour le rendre visible');
  }
  await saveDB(); render();
  return false;
}
async function toggleAd(id){ const ad=DB.ads.find(a=>a.id===id); ad.active=!ad.active; await saveDB(); render(); }
async function deleteAd(id){ DB.ads = DB.ads.filter(a=>a.id!==id); await saveDB(); render(); }

function downloadSubscribersCSV(){
  const rows=[['Prénom','Nom','Email','WhatsApp','Inscrit le'],...DB.subscribers.map(s=>[s.first,s.last,s.email,s.phone||'',s.createdAt])];
  const csv='\\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\\r\\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='afriscope-abonnes-newsletter.csv';a.click();URL.revokeObjectURL(a.href);
}
function downloadSubscribersPDF(){
  if(!window.jspdf?.jsPDF){toast('Le module PDF est indisponible.');return;}
  const doc=new window.jspdf.jsPDF(); doc.setFontSize(16); doc.text('AfriScope Media — Abonnés newsletter',14,16); doc.setFontSize(9); let y=28;
  doc.text('Prénom / Nom',14,y);doc.text('Email',65,y);doc.text('WhatsApp',145,y);y+=7;
  DB.subscribers.forEach(s=>{if(y>280){doc.addPage();y=18;} doc.text(String((s.first||'')+' '+(s.last||'')).slice(0,30),14,y);doc.text(String(s.email||'').slice(0,42),65,y);doc.text(String(s.phone||'').slice(0,18),145,y);y+=6;});
  doc.save('afriscope-abonnes-newsletter.pdf');
}
